<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Draft - laz.dev</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/">laz.dev</a></h1>
      <nav>
        <a href="/projects.html">projects</a>
        <a href="/articles.html">articles</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <article>
      <div class="article-header">
        <div class="article-meta">
          <span>2026-03-12</span>
          <div class="vote-widget" data-slug="example-draft">
            <button class="vote-btn vote-up" onclick="vote('example-draft','up')">&#9650;</button>
            <span class="vote-score">0</span>
            <button class="vote-btn vote-down" onclick="vote('example-draft','down')">&#9660;</button>
          </div>
        </div>
        <h1>Example Draft</h1>
      </div>

      <div class="article-body">
        <p>This is an <strong>example draft</strong> to test the build pipeline. Delete after verifying.</p>
      </div>
    </article>

    <div class="subscribe-section" id="subscribe">
      <h2>get notified</h2>
      <p>new posts, no spam, unsubscribe whenever.</p>
      <form class="subscribe-form" onsubmit="return false">
        <input type="email" placeholder="you@example.com" required>
        <button type="submit">subscribe</button>
      </form>
      <div class="subscribe-msg"></div>
    </div>
  </main>

  <footer>
    <div class="container">&copy; 2026 laz.dev</div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
